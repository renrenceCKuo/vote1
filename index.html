<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>家長委員線上投票系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');body{font-family:'Noto Sans TC',sans-serif;background:#f3f4f6}.fade{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>
</head>
<body class="min-h-screen text-gray-800">
<nav class="bg-indigo-600 text-white shadow sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between"><div class="font-bold text-lg md:text-xl"><i class="fa-solid fa-check-to-slot mr-2"></i><span id="navTitle">家長委員線上投票系統</span></div><div class="flex gap-2"><button id="voteNav" class="px-3 py-2 rounded hover:bg-white/15">投票</button><button id="adminNav" class="px-3 py-2 rounded hover:bg-white/15">管理</button></div></div></nav>
<main class="max-w-7xl mx-auto px-4 py-8">
<section id="loading" class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow text-center"><i class="fa-solid fa-cloud-arrow-down text-5xl text-indigo-600 mb-4"></i><h2 class="text-2xl font-bold">正在連線選舉資料</h2><p class="text-gray-500 mt-2">請稍候…</p></section>
<section id="voteView" class="hidden fade pb-24">
 <div id="closedBox" class="hidden max-w-2xl mx-auto bg-white rounded-2xl shadow p-10 text-center"><i class="fa-solid fa-lock text-5xl text-gray-400 mb-4"></i><h2 class="text-2xl font-bold">目前尚未開放投票</h2><p class="text-gray-500 mt-2">請依現場工作人員指示操作。</p></div>
 <div id="voteBox" class="hidden">
  <div class="bg-white rounded-xl shadow p-6 mb-6 border-t-4 border-indigo-600"><h3 class="font-bold text-lg mb-4">投票人資料</h3><div class="grid md:grid-cols-2 gap-4"><div><label class="text-sm">投票編號</label><input id="voterId" class="w-full border rounded-lg px-4 py-2 mt-1" autocomplete="off"></div><div><label class="text-sm">姓名</label><input id="voterName" class="w-full border rounded-lg px-4 py-2 mt-1" autocomplete="off"></div></div></div>
  <div class="flex flex-wrap justify-between items-end gap-3 mb-5"><div><h2 class="text-2xl font-bold">請選擇候選人</h2><p id="ruleText" class="text-indigo-600 font-medium mt-1"></p></div><div id="candidateCount" class="text-gray-500"></div></div>
  <div id="candidateGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  <div class="fixed bottom-0 left-0 w-full bg-white border-t shadow-lg p-4 z-40"><div class="max-w-7xl mx-auto flex justify-between items-center"><div>已選擇 <b id="selectedCount" class="text-indigo-600 text-xl">0</b> 人</div><button id="submitBtn" class="bg-indigo-600 text-white font-bold px-7 py-3 rounded-lg"><i class="fa-solid fa-paper-plane mr-2"></i>確認送出</button></div></div>
 </div>
</section>
<section id="adminView" class="hidden fade">
 <div id="adminLogin" class="max-w-md mx-auto bg-white rounded-2xl shadow p-8"><h2 class="text-2xl font-bold mb-5"><i class="fa-solid fa-user-shield mr-2 text-indigo-600"></i>管理者登入</h2><input id="adminEmail" type="email" placeholder="管理者 Email" class="w-full border rounded-lg px-4 py-3 mb-3"><input id="adminPassword" type="password" placeholder="密碼" class="w-full border rounded-lg px-4 py-3 mb-4"><button id="loginBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold">登入</button></div>
 <div id="adminPanel" class="hidden space-y-6">
  <div class="flex justify-between items-center"><h2 class="text-2xl font-bold">選舉管理</h2><button id="logoutBtn" class="text-red-600">登出</button></div>
  <div class="grid lg:grid-cols-2 gap-6">
   <div class="bg-white rounded-xl shadow p-6"><h3 class="font-bold text-lg mb-4">基本設定</h3><label class="text-sm">選舉名稱</label><input id="electionName" class="w-full border rounded px-3 py-2 mb-3"><div class="grid grid-cols-3 gap-3"><div><label class="text-sm">最少投</label><input id="minVotes" type="number" min="1" class="w-full border rounded px-3 py-2"></div><div><label class="text-sm">最多投</label><input id="maxVotes" type="number" min="1" class="w-full border rounded px-3 py-2"></div><div><label class="text-sm">應選</label><input id="seats" type="number" min="1" class="w-full border rounded px-3 py-2"></div></div><div class="mt-4 flex items-center gap-3"><input id="isOpen" type="checkbox" class="w-5 h-5"><label for="isOpen">開放投票</label></div><div class="mt-2 flex items-center gap-3"><input id="showResults" type="checkbox" class="w-5 h-5"><label for="showResults">投票端公開即時結果</label></div><button id="saveSettings" class="mt-5 bg-indigo-600 text-white px-5 py-2 rounded font-bold">儲存設定</button></div>
   <div class="bg-white rounded-xl shadow p-6"><h3 class="font-bold text-lg mb-4">Excel 匯入</h3><p class="text-sm text-gray-500 mb-3">候選人：第一列為欄名，建議包含「編號、班級、姓名」。投票人名冊：需包含「投票編號、姓名」。</p><label class="block font-medium mb-1">候選人 Excel</label><input id="candidateFile" type="file" accept=".xlsx,.xls,.csv" class="w-full mb-4"><button id="importCandidates" class="bg-emerald-600 text-white px-4 py-2 rounded">匯入候選人</button><hr class="my-5"><label class="block font-medium mb-1">投票人名冊 Excel</label><input id="voterFile" type="file" accept=".xlsx,.xls,.csv" class="w-full mb-4"><button id="importVoters" class="bg-emerald-600 text-white px-4 py-2 rounded">匯入投票人</button></div>
  </div>
  <div class="grid md:grid-cols-4 gap-4"><div class="bg-white rounded-xl shadow p-5"><div class="text-gray-500">候選人</div><div id="statCandidates" class="text-3xl font-bold">0</div></div><div class="bg-white rounded-xl shadow p-5"><div class="text-gray-500">合格投票人</div><div id="statEligible" class="text-3xl font-bold">0</div></div><div class="bg-white rounded-xl shadow p-5"><div class="text-gray-500">已投票人數</div><div id="statTurnout" class="text-3xl font-bold">0</div></div><div class="bg-white rounded-xl shadow p-5"><div class="text-gray-500">投票率</div><div id="statRate" class="text-3xl font-bold">0%</div></div></div>
  <div class="bg-white rounded-xl shadow p-6"><div class="flex flex-wrap justify-between gap-3 mb-5"><h3 class="font-bold text-xl">即時開票</h3><div class="flex gap-2"><button id="exportBtn" class="bg-emerald-600 text-white px-4 py-2 rounded">匯出結果</button><button id="resetBtn" class="bg-red-600 text-white px-4 py-2 rounded">清除本次票數</button></div></div><div id="adminResults" class="space-y-4"></div></div>
 </div>
</section>
<section id="publicResults" class="hidden fade mt-6"><div class="bg-white rounded-xl shadow p-6"><h2 class="text-2xl font-bold mb-5">即時投票結果</h2><div id="publicResultsRows" class="space-y-4"></div></div></section>
</main>
<footer class="text-center text-sm text-gray-500 py-8">C.Kuo Voting System Ver2.0</footer>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import {getAuth,signInAnonymously,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,collection,onSnapshot,getDocs,writeBatch,deleteDoc} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
import {getFunctions,httpsCallable} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-functions.js';
// ===== 部署前只需填入 Firebase 專案設定 =====
const firebaseConfig = {
 apiKey: "YOUR_API_KEY", authDomain: "YOUR_PROJECT.firebaseapp.com", projectId: "YOUR_PROJECT_ID",
 storageBucket: "YOUR_PROJECT.firebasestorage.app", messagingSenderId: "YOUR_SENDER_ID", appId: "YOUR_APP_ID"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app), functions=getFunctions(app,'asia-east1');
const electionRef=doc(db,'config','election'); let settings={name:'家長委員線上投票系統',minVotes:1,maxVotes:8,seats:8,isOpen:false,showResults:false}; let candidates=[],selected=new Set(),admin=false,turnout=0,eligible=0;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function view(v){['loading','voteView','adminView','publicResults'].forEach(x=>$(x).classList.add('hidden')); $(v).classList.remove('hidden')}
$('voteNav').onclick=()=>{view('voteView');renderVoteState()}; $('adminNav').onclick=()=>{view('adminView');renderAdminAuth()};
async function boot(){try{await signInAnonymously(auth);onSnapshot(electionRef,s=>{if(s.exists())settings={...settings,...s.data()};applySettings()});onSnapshot(collection(db,'candidates'),s=>{candidates=s.docs.map(d=>({id:d.id,...d.data()}));renderCandidates();renderResults();$('statCandidates').textContent=candidates.length});onSnapshot(collection(db,'ballots'),s=>{turnout=s.size;renderStats()});onSnapshot(collection(db,'eligibleVoters'),s=>{eligible=s.size;renderStats()});view('voteView');renderVoteState()}catch(e){console.error(e);Swal.fire('連線失敗','請確認 Firebase 設定與部署是否完成。','error')}} boot();
function applySettings(){$('navTitle').textContent=settings.name;$('electionName').value=settings.name;$('minVotes').value=settings.minVotes;$('maxVotes').value=settings.maxVotes;$('seats').value=settings.seats;$('isOpen').checked=!!settings.isOpen;$('showResults').checked=!!settings.showResults;$('ruleText').textContent=`每人可投 ${settings.minVotes} 至 ${settings.maxVotes} 人；應選 ${settings.seats} 人`;renderVoteState()}
function renderVoteState(){if(!$('voteView').classList.contains('hidden')){$('closedBox').classList.toggle('hidden',settings.isOpen);$('voteBox').classList.toggle('hidden',!settings.isOpen);$('publicResults').classList.toggle('hidden',!settings.showResults)}}
function findKey(o,words){return Object.keys(o).find(k=>words.some(w=>k.includes(w)))}
function renderCandidates(){$('candidateCount').textContent=`共 ${candidates.length} 位候選人`;$('candidateGrid').innerHTML=candidates.map((c,i)=>{let nk=findKey(c,['家長姓名','姓名','家長','名稱']),ck=findKey(c,['班級','班']),num=findKey(c,['編號','號次','序號']);let skip=new Set(['id','votes',nk,ck,num]);let details=Object.keys(c).filter(k=>!skip.has(k)).map(k=>`<div><span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded">${esc(k)}</span><p class="text-sm mt-1">${esc(c[k])}</p></div>`).join('');let on=selected.has(c.id);return `<div class="bg-white rounded-xl shadow border-2 ${on?'border-indigo-600':'border-transparent'} overflow-hidden cursor-pointer" data-id="${esc(c.id)}"><div class="p-5"><div class="flex gap-3 items-center border-b pb-3 mb-3"><div class="w-12 h-12 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold">${esc(c[num]||i+1)}</div><div><h3 class="text-xl font-bold">${esc(c[nk]||'候選人')}</h3>${c[ck]?`<div class="text-indigo-600 font-medium">學生班級：${esc(c[ck])}</div>`:''}</div></div><div class="space-y-2">${details}</div></div><div class="p-3 bg-gray-50 text-center font-bold ${on?'text-indigo-600':''}">${on?'✓ 已選擇':'點選此候選人'}</div></div>`}).join('');document.querySelectorAll('#candidateGrid [data-id]').forEach(el=>el.onclick=()=>toggle(el.dataset.id));$('selectedCount').textContent=selected.size}
function toggle(id){if(selected.has(id))selected.delete(id);else if(selected.size>=settings.maxVotes)return Swal.fire('已達上限',`最多只能選 ${settings.maxVotes} 人`,'warning');else selected.add(id);renderCandidates()}
$('submitBtn').onclick=async()=>{let voterId=$('voterId').value.trim(),name=$('voterName').value.trim();if(!voterId||!name)return Swal.fire('資料不完整','請輸入投票編號與姓名。','warning');if(selected.size<settings.minVotes||selected.size>settings.maxVotes)return Swal.fire('票數不符',`請選擇 ${settings.minVotes} 至 ${settings.maxVotes} 人。`,'warning');let r=await Swal.fire({title:'確認送出選票？',text:`您選擇了 ${selected.size} 位候選人，送出後無法修改。`,icon:'question',showCancelButton:true,confirmButtonText:'確定送出',cancelButtonText:'返回'});if(!r.isConfirmed)return;try{Swal.fire({title:'正在送出…',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});let submit=httpsCallable(functions,'submitVote');await submit({voterId,name,candidateIds:[...selected]});await Swal.fire('投票成功','選票已安全寫入。','success');selected.clear();$('voterId').value='';$('voterName').value='';renderCandidates()}catch(e){console.error(e);Swal.fire('無法送出',e?.message?.replace('FirebaseError: ','')||'請洽管理者。','error')}};
function renderResults(){let arr=[...candidates].sort((a,b)=>(b.votes||0)-(a.votes||0));let max=Math.max(1,...arr.map(x=>x.votes||0));let rows=arr.map((c,i)=>{let nk=findKey(c,['家長姓名','姓名','家長','名稱']),ck=findKey(c,['班級','班']);let tiedBoundary=settings.seats>0&&i>=settings.seats-1&&arr[settings.seats-1]&&arr[settings.seats]&&(arr[settings.seats-1].votes||0)===(arr[settings.seats].votes||0)&&(c.votes||0)===(arr[settings.seats-1].votes||0);return `<div><div class="flex justify-between"><b>${i+1}. ${esc(c[ck]||'')} ${esc(c[nk]||c.id)} ${tiedBoundary?'<span class="text-amber-600">（應選線同票）</span>':''}</b><span>${c.votes||0} 票</span></div><div class="h-3 bg-gray-200 rounded mt-1"><div class="h-3 bg-indigo-600 rounded" style="width:${((c.votes||0)/max)*100}%"></div></div></div>`}).join('');$('adminResults').innerHTML=rows||'<p class="text-gray-500">尚無候選人資料</p>';$('publicResultsRows').innerHTML=rows}
function renderStats(){$('statEligible').textContent=eligible;$('statTurnout').textContent=turnout;$('statRate').textContent=eligible?`${Math.round(turnout/eligible*100)}%`:'0%'}
onAuthStateChanged(auth,u=>{admin=!!u&&!u.isAnonymous;renderAdminAuth()});function renderAdminAuth(){$('adminLogin').classList.toggle('hidden',admin);$('adminPanel').classList.toggle('hidden',!admin)}
$('loginBtn').onclick=async()=>{try{await signOut(auth);await signInWithEmailAndPassword(auth,$('adminEmail').value.trim(),$('adminPassword').value)}catch(e){Swal.fire('登入失敗','請確認管理者帳號密碼。','error');await signInAnonymously(auth)}};$('logoutBtn').onclick=async()=>{await signOut(auth);await signInAnonymously(auth)};
$('saveSettings').onclick=async()=>{if(!admin)return;let data={name:$('electionName').value.trim()||'家長委員線上投票系統',minVotes:+$('minVotes').value,maxVotes:+$('maxVotes').value,seats:+$('seats').value,isOpen:$('isOpen').checked,showResults:$('showResults').checked};if(data.minVotes<1||data.maxVotes<data.minVotes||data.seats<1)return Swal.fire('設定錯誤','請檢查票數與應選人數。','warning');await setDoc(electionRef,data);Swal.fire('已儲存','','success')};
async function readExcel(file){let buf=await file.arrayBuffer(),wb=XLSX.read(buf),ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:''})}
async function clearCollection(name){let s=await getDocs(collection(db,name));for(let i=0;i<s.docs.length;i+=400){let b=writeBatch(db);s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
$('importCandidates').onclick=async()=>{let f=$('candidateFile').files[0];if(!f)return Swal.fire('請選擇檔案','','warning');let rows=await readExcel(f);if(!rows.length)return;let ok=await Swal.fire({title:`匯入 ${rows.length} 位候選人？`,text:'將取代目前候選人名單。建議只在尚未投票時操作。',showCancelButton:true});if(!ok.isConfirmed)return;await clearCollection('candidates');for(let i=0;i<rows.length;i+=400){let b=writeBatch(db);rows.slice(i,i+400).forEach((r,j)=>b.set(doc(db,'candidates',String(i+j+1).padStart(4,'0')),{...r,votes:0}));await b.commit()}Swal.fire('匯入完成','','success')};
$('importVoters').onclick=async()=>{let f=$('voterFile').files[0];if(!f)return Swal.fire('請選擇檔案','','warning');let rows=await readExcel(f),idKey=rows[0]&&findKey(rows[0],['投票編號','編號','代碼']),nameKey=rows[0]&&findKey(rows[0],['姓名','家長']);if(!idKey||!nameKey)return Swal.fire('格式錯誤','找不到「投票編號」或「姓名」欄位。','error');await clearCollection('eligibleVoters');for(let i=0;i<rows.length;i+=400){let b=writeBatch(db);rows.slice(i,i+400).forEach(r=>{let id=String(r[idKey]).trim();if(id)b.set(doc(db,'eligibleVoters',id),{name:String(r[nameKey]).trim()})});await b.commit()}Swal.fire('匯入完成','','success')};
$('resetBtn').onclick=async()=>{let r=await Swal.fire({title:'確定清除全部票數？',text:'此動作無法復原。',icon:'warning',showCancelButton:true,confirmButtonText:'確定清除'});if(!r.isConfirmed)return;await clearCollection('ballots');let s=await getDocs(collection(db,'candidates'));for(let i=0;i<s.docs.length;i+=400){let b=writeBatch(db);s.docs.slice(i,i+400).forEach(d=>b.update(d.ref,{votes:0}));await b.commit()}Swal.fire('已清除','','success')};
$('exportBtn').onclick=()=>{let arr=[...candidates].sort((a,b)=>(b.votes||0)-(a.votes||0)).map((c,i)=>({排名:i+1,得票數:c.votes||0,...Object.fromEntries(Object.entries(c).filter(([k])=>!['id','votes'].includes(k)))}));let ws=XLSX.utils.json_to_sheet(arr),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'投票結果');XLSX.writeFile(wb,`${settings.name}-投票結果.xlsx`)};
</script></body></html>
